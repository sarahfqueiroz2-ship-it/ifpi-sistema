<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Aulas - IFPI Campus Pedro II</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --verde-principal: #2d8659;
            --verde-escuro: #1a5438;
            --branco: #ffffff;
            --cinza-bg: #fafbfc;
            --cinza-medio: #f5f6f7;
            --cinza-borda: #e1e4e8;
            --cinza-texto: #24292e;
            --cinza-secundario: #586069;
            --vermelho: #d73a49;
            --amarelo: #f9c74f;
            --azul: #0366d6;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--cinza-bg);
            color: var(--cinza-texto);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100vh;
            background-color: var(--branco);
            border-right: 1px solid var(--cinza-borda);
            padding: 24px 0;
            z-index: 1000;
            transition: transform 0.3s ease;
        }

        /* Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            display: none;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .logo-container {
            padding: 0 24px 24px;
            border-bottom: 1px solid var(--cinza-borda);
            margin-bottom: 24px;
        }

        .logo-container img {

            margin-bottom: 10px;
        }

        .nav-menu {
            padding: 0 16px;
        }

        .nav-section-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--cinza-secundario);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 12px 8px;
            margin-top: 12px;
        }

        .nav-item {

            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            color: var(--cinza-secundario);
            text-decoration: none;

            font-weight: 500;

        }

        .nav-item:hover {

            color: var(--cinza-texto);
        }

        }

        }

        /* Header */

            left: 260px;
            right: 0;

        /* Botão Menu */

        }

        .menu-toggle svg {

        .header-title {

        }

        .user-section {
            display: flex;

        .user-info {
            text-align: right;
        }

        .user-name {

            color: var(--cinza-texto);
            display: block;
        }

            font-size: 12px;

        }

.user-avatar {
    width: 40px;

    background-color: var(--verde-principal);

    font-size: 14px;
}

        /* Main Content */

        }

        .detalhes-valor.black {

        }

        }

        .btn-logout {

        /* Responsive */
        @media (max-width: 768px) {

    </style>
</head>

<script>
    const API = 'http://10.14.3.69:8080';
    let user = null;
    let todosRegistros = [];
    let professoresUnicos = [];

    // Menu Toggle
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const menuToggle = document.getElementById('menuToggle');

    function toggleMenu() {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('active');
    }

    function closeMenu() {
        sidebar.classList.remove('open');
        overlay.classList.remove('active');
    }

    if (menuToggle) {
        menuToggle.addEventListener('click', toggleMenu);
    }
    if (overlay) {
        overlay.addEventListener('click', closeMenu);
    }


// ================== FUNÇÕES DE MENU ==================
function gerarMenu() {
    const userData = JSON.parse(localStorage.getItem('user')) || JSON.parse(sessionStorage.getItem('user'));
    const tipo = userData ? userData.tipo : null;
    
    // Se for professor, redirecionar para calendario_professor.html
    if (tipo === 'professor') {
        window.location.href = 'calendario_professor.html';
        return;
    }
    
    const navMenu = document.getElementById('navMenu');
    if (!navMenu) return;
    
    // Links para coordenador, técnico administrativo e admin
    let links = [
        { href: 'pagina-inicial.html', icon: 'M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z', text: 'Dashboard' },
        { href: 'formulario.html', icon: 'M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z', text: 'Novo Registro' },
        { href: 'historico-de-registro.html', icon: 'M9 2a1 1 0 000 2h2a1 1 0 100-2H9z M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z', text: 'Histórico' },
        { href: 'pagina-administrativa.html', icon: 'M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z', text: 'Controle de Aulas' }
    ];
    
    // Se for COORDENADOR, adicionar o link do calendário
    if (tipo === 'coordenador') {
        links.push({ 
            href: 'calendario_professor.html', 
            icon: 'M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z', 
            text: 'Calendário' 
        });
    }
    
    // Se for ADMIN, adicionar o link de gerenciar usuários
    if (tipo === 'admin') {
        links.push({ 
            href: 'admin_usuarios.html', 
            icon: 'M12 4a4 4 0 10-8 0 4 4 0 008 0zm-4 6a6 6 0 00-6 6v1h12v-1a6 6 0 00-6-6zm7 0a3 3 0 00-3 3v1h6v-1a3 3 0 00-3-3z', 
            text: 'Gerenciar Usuários' 
        });
    }
    
    // Gerar HTML dos links
    let html = '';
    links.forEach(link => {
        const isActive = window.location.pathname.includes(link.href.replace('.html', ''));
        const activeClass = isActive ? 'active' : '';
        
        html += `
            <a href="${link.href}" class="nav-item ${activeClass}">
                <svg class="nav-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path d="${link.icon}"/>
                </svg>
                ${link.text}
            </a>
        `;
    });
    
    // Adicionar o logout no final
    html += `
        <div class="logout-section">
            <a href="javascript:void(0)" onclick="logout()" class="btn-logout">
                <svg class="logout-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/>
                </svg>
                Sair do Sistema
            </a>
        </div>
    `;
    
    navMenu.innerHTML = html;
}

function logout() {
    localStorage.removeItem('user');
    sessionStorage.removeItem('user');
    window.location.href = 'login.html';
}

    // ================== FUNÇÕES PRINCIPAIS ==================
    
    async function carregarRegistros() {
        try {
            const resp = await fetch(`${API}/registros`);
            const data = await resp.json();
            todosRegistros = data.registros || [];
            console.log('Registros carregados:', todosRegistros.length);

            const profs = new Set();
            todosRegistros.forEach(r => {
                if (r.professor_nome) profs.add(r.professor_nome);
            });
            professoresUnicos = Array.from(profs).sort();

            const select = document.getElementById('filtroProfessor');
            select.innerHTML = '<option value="">Todos os professores</option>';
            professoresUnicos.forEach(prof => {
                const opt = document.createElement('option');
                opt.value = prof;
                opt.textContent = prof;
                select.appendChild(opt);
            });

            aplicarFiltros();
        } catch(err) {
            console.error('Erro:', err);
        }
    }

    function aplicarFiltros() {
        const profSelecionado = document.getElementById('filtroProfessor').value;
        const dataInicial = document.getElementById('filtroDataInicial').value;
        const dataFinal = document.getElementById('filtroDataFinal').value;

        let registrosFiltrados = [...todosRegistros];

        if (profSelecionado) {
            registrosFiltrados = registrosFiltrados.filter(r => r.professor_nome === profSelecionado);
        }

        if (dataInicial) {
            const dataInicioObj = new Date(dataInicial + 'T00:00:00');
            registrosFiltrados = registrosFiltrados.filter(r => {
                const dataReg = new Date(r.data);
                return dataReg >= dataInicioObj;
            });
        }

        if (dataFinal) {
            const dataFimObj = new Date(dataFinal + 'T23:59:59');
            registrosFiltrados = registrosFiltrados.filter(r => {
                const dataReg = new Date(r.data);
                return dataReg <= dataFimObj;
            });
        }

        // Agrupar por PROFESSOR + TURMA + DISCIPLINA
        const gruposMap = new Map();

        registrosFiltrados.forEach(r => {
            const nome = r.professor_nome;
            const curso = r.curso_nome || 'Curso não informado';
            const serie = r.serie || 'Série não informada';
            const disciplina = r.disciplina || 'Disciplina não informada';
            
            if (!nome) return;

            const chave = `${nome}|${curso}|${serie}|${disciplina}`;

            if (!gruposMap.has(chave)) {
                gruposMap.set(chave, {
                    professor: nome,
                    curso: curso,
                    serie: serie,
                    disciplina: disciplina,
                    totalAulas: 0,
                    antecipadas: 0,
                    reposicoes: 0,
                    ausencias: 0
                });
            }

            const grupo = gruposMap.get(chave);
            const qtd = r.quantidade || 0;

            grupo.totalAulas += qtd;

            const tipo = r.tipo ? r.tipo.toLowerCase() : '';

            if (tipo === 'antecipacao' || tipo === 'antecipação') {
                grupo.antecipadas += qtd;
            } else if (tipo === 'reposicao' || tipo === 'reposição') {
                grupo.reposicoes += qtd;
            } else if (tipo === 'ausencia' || tipo === 'ausência') {
                grupo.ausencias += qtd;
            }
        });

        const grupos = Array.from(gruposMap.values());
        renderizarTabela(grupos);

        const countSpan = document.getElementById('resultadoCount');
        if (!countSpan) {
            const newSpan = document.createElement('span');
            newSpan.id = 'resultadoCount';
            newSpan.style.marginLeft = '20px';
            newSpan.style.fontSize = '14px';
            newSpan.style.color = 'var(--cinza-secundario)';
            document.querySelector('.table-header').appendChild(newSpan);
        }
        document.getElementById('resultadoCount').textContent = `${grupos.length} registros encontrados`;
    }

    function renderizarTabela(grupos) {
        const tbody = document.querySelector('#professoresTable tbody');
        tbody.innerHTML = '';

        if (grupos.length === 0) {
            tbody.innerHTML = '^<td colspan="6" style="text-align:center;padding:40px;">Nenhum registro encontrado para o período.<\/td><\/tr>';
            return;
        }

        grupos.forEach((grupo, index) => {
            const saldo = (grupo.antecipadas + grupo.reposicoes) - grupo.ausencias;
            const status = saldo >= 0 ? 'concluido' : 'pendente';
            const statusTexto = saldo >= 0 ? 'Concluído' : 'Pendente';
            const saldoFormatado = saldo >= 0 ? `+${saldo}` : saldo;
            const saldoClasse = saldo >= 0 ? 'green' : 'red';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${grupo.professor}</strong><\/td>
                <td>${grupo.curso}<\/td>
                <td>${grupo.serie}<\/td>
                <td>${grupo.disciplina}<\/td>
                <td><strong>${grupo.totalAulas}</strong> aulas<\/td>
                <td><span class="badge ${status}">${statusTexto}</span><\/td>
                <td><button class="btn-detalhar" onclick="toggleDetalhes(${index})">Detalhar<\/button><\/td>
            `;
            tbody.appendChild(tr);

            const trDetalhes = document.createElement('tr');
            trDetalhes.className = 'detalhes-row';
            trDetalhes.id = `detalhes-${index}`;
            trDetalhes.innerHTML = `
                <td colspan="7">
                    <table class="detalhes-table">
                        <thead>
                            <tr>
                                <th>Total</th>
                                <th>Antecipadas</th>
                                <th>Reposições</th>
                                <th>Ausências</th>
                                <th>Saldo</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td><div class="detalhes-valor black">${grupo.totalAulas}</div><div class="detalhes-descricao">Aulas no período</div></td>
                                <td><div class="detalhes-valor yellow">${grupo.antecipadas}</div><div class="detalhes-descricao">Aulas antecipadas</div></td>
                                <td><div class="detalhes-valor azul">${grupo.reposicoes}</div><div class="detalhes-descricao">Aulas repostas</div></td>
                                <td><div class="detalhes-valor red">${grupo.ausencias}</div><div class="detalhes-descricao">Faltas registradas</div></td>
                                <td><div class="detalhes-valor ${saldoClasse}">${saldoFormatado}</div><div class="detalhes-descricao">Balanço</div><span class="status-badge ${status === 'concluido' ? '' : 'pendente'}">${statusTexto}</span></td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            `;
            tbody.appendChild(trDetalhes);
        });
    }

    function toggleDetalhes(id) {
        const row = document.getElementById(`detalhes-${id}`);
        const isVisible = row.classList.contains('show');
        document.querySelectorAll('.detalhes-row').forEach(r => r.classList.remove('show'));
        if (!isVisible) row.classList.add('show');
    }

    function limparFiltros() {
        document.getElementById('filtroProfessor').value = '';
        const hoje = new Date();
        const primeiroDia = new Date(hoje.getFullYear(), 0, 1);
        document.getElementById('filtroDataInicial').value = primeiroDia.toISOString().split('T')[0];
        document.getElementById('filtroDataFinal').value = hoje.toISOString().split('T')[0];
        aplicarFiltros();
    }

    function gerarRelatorio() {
        const profSelecionado = document.getElementById('filtroProfessor').value;
        const dataInicial = document.getElementById('filtroDataInicial').value;
        const dataFinal = document.getElementById('filtroDataFinal').value;

        let registrosFiltrados = [...todosRegistros];

        if (profSelecionado) {
            registrosFiltrados = registrosFiltrados.filter(r => r.professor_nome === profSelecionado);
        }

        if (dataInicial) {
            const dataInicioObj = new Date(dataInicial + 'T00:00:00');
            registrosFiltrados = registrosFiltrados.filter(r => {
                const dataReg = new Date(r.data);
                return dataReg >= dataInicioObj;
            });
        }

        if (dataFinal) {
            const dataFimObj = new Date(dataFinal + 'T23:59:59');
            registrosFiltrados = registrosFiltrados.filter(r => {
                const dataReg = new Date(r.data);
                return dataReg <= dataFimObj;
            });
        }

        const gruposMap = new Map();
        registrosFiltrados.forEach(r => {
            const nome = r.professor_nome;
            const curso = r.curso_nome || 'Curso não informado';
            const serie = r.serie || 'Série não informada';
            const disciplina = r.disciplina || 'Disciplina não informada';
            if (!nome) return;
            const chave = `${nome}|${curso}|${serie}|${disciplina}`;
            if (!gruposMap.has(chave)) {
                gruposMap.set(chave, { professor: nome, curso: curso, serie: serie, disciplina: disciplina, totalAulas: 0, antecipadas: 0, reposicoes: 0, ausencias: 0 });
            }
            const grupo = gruposMap.get(chave);
            const qtd = r.quantidade || 0;
            grupo.totalAulas += qtd;
            const tipo = r.tipo ? r.tipo.toLowerCase() : '';
            if (tipo === 'antecipacao' || tipo === 'antecipação') grupo.antecipadas += qtd;
            else if (tipo === 'reposicao' || tipo === 'reposição') grupo.reposicoes += qtd;
            else if (tipo === 'ausencia' || tipo === 'ausência') grupo.ausencias += qtd;
        });

        const grupos = Array.from(gruposMap.values());

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        doc.setFontSize(18);
        doc.setTextColor(45, 134, 89);
        doc.text('IFPI Campus Pedro II', 14, 15);
        doc.setFontSize(14);
        doc.setTextColor(0, 0, 0);
        doc.text('Relatório de Aulas - Professores por Turma e Disciplina', 14, 25);

        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        const periodoTexto = dataInicial && dataFinal ? `Período: ${dataInicial.split('-').reverse().join('/')} a ${dataFinal.split('-').reverse().join('/')}` : 'Período: Todo o histórico';
        doc.text(periodoTexto, 14, 33);
        if (profSelecionado) doc.text(`Professor: ${profSelecionado}`, 14, 39);
        const dataGeracao = new Date().toLocaleDateString('pt-BR');
        doc.text(`Gerado em: ${dataGeracao}`, 14, 45);

        const tableColumn = ['Professor', 'Curso', 'Série', 'Disciplina', 'Total', 'Antec', 'Repos', 'Ausen', 'Saldo'];
        const tableRows = grupos.map(grupo => {
            const saldo = (grupo.antecipadas + grupo.reposicoes) - grupo.ausencias;
            return [grupo.professor, grupo.curso, grupo.serie, grupo.disciplina, grupo.totalAulas, grupo.antecipadas, grupo.reposicoes, grupo.ausencias, saldo];
        });

        doc.autoTable({
            head: [tableColumn],
            body: tableRows,
            startY: 50,
            theme: 'grid',
            headStyles: { fillColor: [45, 134, 89], textColor: [255, 255, 255], fontStyle: 'bold' },
            columnStyles: { 0: { cellWidth: 40 }, 1: { cellWidth: 35 }, 2: { cellWidth: 25 }, 3: { cellWidth: 35 }, 4: { cellWidth: 15 }, 5: { cellWidth: 15 }, 6: { cellWidth: 15 }, 7: { cellWidth: 15 }, 8: { cellWidth: 15 } },
            margin: { left: 10, right: 10 }
        });

        const pageCount = doc.internal.getNumberOfPages();
        for (let i = 1; i <= pageCount; i++) {
            doc.setPage(i);
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.text(`Sistema de Controle de Aulas - IFPI Campus Pedro II - Página ${i} de ${pageCount}`, doc.internal.pageSize.getWidth() / 2, doc.internal.pageSize.getHeight() - 10, { align: 'center' });
        }

        const nomeArquivo = profSelecionado ? `relatorio_${profSelecionado.replace(/\s+/g, '_')}_${dataGeracao.replace(/\//g, '-')}.pdf` : `relatorio_todos_professores_${dataGeracao.replace(/\//g, '-')}.pdf`;
        doc.save(nomeArquivo);
    }

    // ================== INICIALIZAÇÃO ==================
    document.addEventListener('DOMContentLoaded', function() {
        // Gerar o menu
        gerarMenu();
        
        // Pegar usuário logado
        user = JSON.parse(localStorage.getItem('user')) || JSON.parse(sessionStorage.getItem('user'));
        
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        
        // VERIFICAR PERMISSÃO
        if (user.tipo !== 'admin' && user.tipo !== 'coordenador' && user.tipo !== 'tecnico_administrativo') {
            alert('Acesso negado. Você não tem permissão para acessar esta página.');
            window.location.href = 'login.html';
            return;
        }
        
        // ATUALIZAR HEADER
        document.getElementById('userNameDisplay').textContent = user.nome;
        const iniciais = user.nome.split(' ').map(n => n[0]).join('').substring(0, 2);
        document.getElementById('userAvatarDisplay').textContent = iniciais;
        
        let roleText = '';
        if (user.tipo === 'admin') roleText = 'Administrador';
        else if (user.tipo === 'coordenador') roleText = 'Coordenador';
        else if (user.tipo === 'tecnico_administrativo') roleText = 'Técnico Administrativo';
        else roleText = 'Usuário';
        document.getElementById('userRoleDisplay').textContent = roleText;
        
        console.log('Usuário logado:', user);
        console.log('Tipo do usuário:', user.tipo);
        
        // Configurar datas padrão
        const hoje = new Date();
        const primeiroDia = new Date(hoje.getFullYear(), 0, 1);
        document.getElementById('filtroDataInicial').value = primeiroDia.toISOString().split('T')[0];
        document.getElementById('filtroDataFinal').value = hoje.toISOString().split('T')[0];
        
        // Carregar dados
        carregarRegistros();
        
        // Evento de busca
        document.getElementById('searchProfessor').addEventListener('input', function() {
            const termo = this.value.toLowerCase();
            document.querySelectorAll('#professoresTable tbody tr:not(.detalhes-row)').forEach(tr => {
                const texto = tr.textContent.toLowerCase();
                tr.style.display = texto.includes(termo) ? '' : 'none';
            });
        });
    });
</script>
